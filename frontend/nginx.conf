server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve hashed assets normally
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 30d;
  }

  # Optional: common static files
  location = /vite.svg { try_files $uri =404; access_log off; expires 30d; }

  # SPA fallback for React Router (BrowserRouter)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
